name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04   # o ubuntu-latest (26.04) nao tem Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install pytest
      # O app so usa a biblioteca padrao; pytest e a unica dependencia de teste.
      - run: python -m pytest tests -q
